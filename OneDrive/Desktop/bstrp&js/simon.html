<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon game</title>
    <link rel="stylesheet" href="simon.css">
</head>
<body>
    <h1>Simon Game</h1>
    <h3>Press any key for to start game</h3>
    <div class="btn-container">
        <div class="line1">
        <div class="btn yellow" type="button">1</div>
        <div class="btn green" type="button">2</div>
        </div>
        <div class="line2">
        <div class="btn red" type="button">3</div>
        <div class="btn purple" type="button">4</div>
        </div>
    </div>
</body>
</html>
